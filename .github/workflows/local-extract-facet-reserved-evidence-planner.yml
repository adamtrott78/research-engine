name: Local EXTRACT Facet Reserved Evidence Planner

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  facet-reserved-evidence-planner:
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/local-extract-facet-reserved-evidence-planner ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || exit 20
          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"
          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' \
              <<<"$pr_json"
          )"
          [[ "$actual_sha" == "$expected_sha" ]]
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Recover exact valid Wave 7A.3 generated intents
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_zip="$RUNNER_TEMP/wave7a3-valid.zip"
          artifact_dir="$RUNNER_TEMP/wave7a3-valid"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/12533721500/zip" \
            -o "$artifact_zip"
          [[ "$(sha256sum "$artifact_zip" | awk '{print $1}')" == \
            "cd02b842ad44bbadab7aad661ff424cc6108f8047d260df5d0064fba2b4f35fb" ]]
          mkdir -m 0700 "$artifact_dir"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          generated="$artifact_dir/local-extract-wave7a3-generated-intents.json"
          [[ "$(sha256sum "$generated" | awk '{print $1}')" == \
            "a5a970725c1f16a694633416ad9fbd98e58418c267891ac83b7783d8af218ebd" ]]
          echo "GENERATED_INTENTS=$generated" >> "$GITHUB_ENV"

      - name: Install exact PDF reader ephemerally
        shell: bash
        run: |
          set -Eeuo pipefail
          wheel="$RUNNER_TEMP/pypdf-6.21.1-py3-none-any.whl"
          pydeps="$RUNNER_TEMP/facet-planner-pydeps"
          url="https://files.pythonhosted.org/packages/85/e6/24c944e473c34e818cf1b98085796fcd780465ecfe17663f2bf8fee1958b/pypdf-6.21.1-py3-none-any.whl"
          expected="553e2d42f5bb3bb2a785a7d3de8ef90bb7df74b5413eff5a7b4388007ea9254b"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$wheel"
          [[ "$(sha256sum "$wheel" | awk '{print $1}')" == "$expected" ]]
          mkdir -m 0700 "$pydeps"
          python3 -m zipfile -e "$wheel" "$pydeps"

      - name: Run frozen facet-reserved evidence planner diagnostic
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          pydeps="$RUNNER_TEMP/facet-planner-pydeps"
          output="$RUNNER_TEMP/local-extract-facet-reserved-evidence-planner.json"
          workdir="$RUNNER_TEMP/local-extract-facet-planner-work"

          PYTHONPATH="$PWD/src:$pydeps" python3 \
            benchmarks/document_intelligence/run_local_extract_facet_reserved_evidence_planner.py \
            --fixture benchmarks/document_intelligence/local-extract-wave1-corpus.v1.json \
            --wave7a3-contract benchmarks/document_intelligence/local-extract-wave7a3-author-anchored-obligations.v1.json \
            --support-fixture benchmarks/document_intelligence/local-extract-teacher-atom-support.v1.json \
            --design benchmarks/document_intelligence/local-extract-facet-reserved-evidence-planner-design.v1.json \
            --wave7a3-result benchmarks/document_intelligence/local-extract-wave7a3-author-anchored-result.v1.json \
            --generated-intents "$GENERATED_INTENTS" \
            --output "$output" \
            --workdir "$workdir"

          python3 - "$output" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["generated_intents_sha256"] == (
              "a5a970725c1f16a694633416ad9fbd98e58418c267891ac83b7783d8af218ebd"
          )
          assert report["architecture_id"] == "FACET_RESERVED_EVIDENCE_PLANNER_V1"
          assert report["reservation_selector_id"] == (
              "TIERED_GENERATOR_ALTERNATING_INTENT_RESERVATION_V1"
          )
          assert report["diagnostic_budgets"] == [24, 26, 28, 32]
          assert report["qwen_model_calls"] == 0
          assert report["external_model_downloads"] == 0
          assert report["hard_safety"]["teacher_used_for_reservation_selection"] is False
          assert report["hard_safety"]["teacher_used_only_for_posthoc_planner_evaluation"] is True
          assert report["scientific_state_materialized"] is False
          assert report["production_routing_changed"] is False
          assert report["qwen_verify_changed"] is False
          assert report["wave7b_started"] is False
          assert report["semantic_control_or_ontology_output"] is False
          assert report["rejected_mechanism_rescue"] is False
          assert report["facet_reservation_decision"] in {
              "FACET_RESERVATION_CONFIRMED",
              "FACET_RESERVATION_PARTIAL",
              "FACET_RESERVATION_NEGATIVE",
              "INVALID_EXECUTION",
          }
          if report["facet_reservation_decision"] != "INVALID_EXECUTION":
              assert report["hard_safety"]["generated_intents_identity_pass"] is True
              assert report["hard_safety"]["immutable_core_identity_pass"] is True
              assert report["hard_safety"]["maximum_budget_reached"] is True
              assert report["hard_safety"]["all_selected_propositions_exactly_locatable"] is True
          print("FACET_RESERVED_EVIDENCE_PLANNER_RECEIPT=PASS")
          PY

      - name: Upload facet-reserved evidence planner report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-extract-facet-reserved-evidence-planner
          path: ${{ runner.temp }}/local-extract-facet-reserved-evidence-planner.json
          if-no-files-found: error
          retention-days: 14
