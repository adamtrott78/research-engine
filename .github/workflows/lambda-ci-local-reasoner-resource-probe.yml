name: Lambda CI Local Reasoner Resource Probe
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
jobs:
  probe:
    name: "${{ format('wc-admission-v1|workload=gpu-experiment-public|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-reasoner-probe ')
    runs-on: lambda-research-engine-gpu
    timeout-minutes: 20
    steps:
      - name: Parse and bind exact request
        id: gate
        env:
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="$(awk '{print $2}' <<<"$BODY")"
          candidate="$(awk '{print $3}' <<<"$BODY")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate" == "qwen35-9b-q6-resource" || "$candidate" == "qwythos-9b-v2-q6-resource" ]]
          actual="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPOSITORY/pulls/$PR" | python3 -c 'import json,sys;print(json.load(sys.stdin)["head"]["sha"])')"
          [[ "$actual" == "$sha" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      - name: Safety preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(id -un)" == "ci-research-engine" ]]
          [[ -n "${P5_GPU_TARGET_UUID:-}" && "${CUDA_VISIBLE_DEVICES:-}" == "$P5_GPU_TARGET_UUID" ]]
          [[ ! -r /home/atrott/.ssh ]]
          [[ ! -r /home/atrott/adamArchives/Adam/workspace-control ]]
          [[ ! -r /var/lib/workspace-ci/controller/github-token ]]
          if [[ -e /var/run/docker.sock ]]; then [[ ! -r /var/run/docker.sock && ! -w /var/run/docker.sock ]]; fi
          if timeout 2 bash -c '</dev/tcp/127.0.0.1/5432' 2>/dev/null; then exit 31; fi
      - name: Checkout exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Build exact llama.cpp runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$RUNNER_TEMP/llama.cpp"
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$src"
          git -C "$src" checkout --detach 620d2225cc436ab0b001e3200e590e3b286ef9ab
          cmake -S "$src" -B "$src/build" -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$src/build" --target llama-cli -j 4
          "$src/build/bin/llama-cli" --version
      - name: Run frozen single-GPU resource probe
        env:
          CANDIDATE: ${{ steps.gate.outputs.candidate }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 benchmarks/semantic_control/run_local_reasoner_resource_probe.py             --contract benchmarks/semantic_control/local-reasoner-resource-probe.v1.json             --candidate "$CANDIDATE"             --llama-cli "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli"             --output "$RUNNER_TEMP/local-reasoner-resource-probe.json"
      - name: Upload compact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-reasoner-resource-probe-${{ steps.gate.outputs.candidate }}
          path: ${{ runner.temp }}/local-reasoner-resource-probe.json
          if-no-files-found: error
          retention-days: 7
