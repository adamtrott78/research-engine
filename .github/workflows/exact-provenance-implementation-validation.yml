name: Exact Provenance Implementation Validation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: "${{ format('wc-admission-v1|workload=cpu-validation-exact-provenance|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/validate-exact-provenance-binding ')
    runs-on: lambda-research-engine
    timeout-minutes: 60

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || exit 20
          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"
          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' \
              <<<"$pr_json"
          )"
          [[ "$actual_sha" == "$expected_sha" ]]
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Prove bounded CPU validation runner
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(id -un)" == "ci-research-engine" ]]
          [[ ! -r /home/atrott ]]
          [[ ! -r /var/lib/workspace-ci/controller/github-token ]]
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
            echo "Validation job unexpectedly has NVIDIA device access" >&2
            exit 31
          fi

      - name: Checkout exact implementation SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify reviewed design and implementation surface
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object benchmarks/document_intelligence/local-extract-exact-provenance-binding-microbenchmark.v1.json)" == \
            "09603c4d65114c75ad3e112a357ee45da384f63e" ]]
          [[ "$(git hash-object src/research_engine/local_extract_exact_provenance_binding.py)" == \
            "64220b325e4fdd91ce84c8810cfcd516b3e08d48" ]]
          [[ "$(git hash-object benchmarks/document_intelligence/run_local_extract_exact_provenance_binding.py)" == \
            "7450ef588725a095cc237449afecef9eb93d08cd" ]]
          [[ "$(git hash-object .github/workflows/local-extract-exact-provenance-binding-microbenchmark.yml)" == \
            "9e710caf10ba3ffda9cb614c535b2a63494f5fef" ]]
          [[ "$(git hash-object tests/test_local_extract_exact_provenance_binding_design.py)" == \
            "de9b692c4b034c566db5dd7fde5ad329a6b9e039" ]]
          [[ "$(git hash-object tests/test_local_extract_exact_provenance_binding.py)" == \
            "9b0a5690cde17b3743c800bf864aaae9b95bfd3a" ]]
          [[ "$(git hash-object tests/test_local_extract_exact_provenance_binding_workflow.py)" == \
            "ff8a83815d027b0c4ecdedd2dd3f152df96233ba" ]]

      - name: Compile exact implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            src/research_engine/local_extract_exact_provenance_binding.py \
            benchmarks/document_intelligence/run_local_extract_exact_provenance_binding.py \
            tests/test_local_extract_exact_provenance_binding_design.py \
            tests/test_local_extract_exact_provenance_binding.py \
            tests/test_local_extract_exact_provenance_binding_workflow.py

      - name: Run exact contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          venv="$RUNNER_TEMP/exact-provenance-validation-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -e ".[dev]"
          "$venv/bin/python" -m pytest -q \
            tests/test_local_extract_exact_provenance_binding_design.py \
            tests/test_local_extract_exact_provenance_binding.py \
            tests/test_local_extract_exact_provenance_binding_workflow.py

      - name: Emit implementation validation receipt
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          receipt="$RUNNER_TEMP/exact-provenance-implementation-validation.json"
          python3 - "$receipt" "$actual_sha" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          payload = {
              "schema_version": 1,
              "decision": "PASS",
              "validation_kind": "EXACT_PROVENANCE_IMPLEMENTATION_CONTRACT",
              "implementation_sha": sys.argv[2],
              "reviewed_design_blob": "09603c4d65114c75ad3e112a357ee45da384f63e",
              "scientific_execution": False,
              "model_invoked": False,
              "sealed_acceptance_benchmark_accessed": False,
              "acceptance_candidate_frozen": False,
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload implementation validation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-provenance-implementation-validation
          path: ${{ runner.temp }}/exact-provenance-implementation-validation.json
          if-no-files-found: error
          retention-days: 14
