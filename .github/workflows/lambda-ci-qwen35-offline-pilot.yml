name: Lambda CI Qwen3.5 Offline Pilot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  qwen35-offline-pilot:
    name: "${{ format('wc-admission-v1|workload=model-eval-single-gpu|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-ci-qwen35-pilot ')
    runs-on: lambda-research-engine-gpu
    timeout-minutes: 15

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid /lambda-ci-qwen35-pilot SHA" >&2
            exit 20
          }

          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"

          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' \
              <<<"$pr_json"
          )"

          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Requested SHA does not match current PR head" >&2
            echo "requested=$expected_sha" >&2
            echo "actual=$actual_sha" >&2
            exit 21
          }

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Prove exact offline model/runtime binding
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_model_root="/srv/workspace-ci/research-engine/trusted-cache/objects/model/sha256/6e28e2560c07e7dabab92c55dbfb6941d5a7a75c8068bdc7a98115d8dc62072c"
          expected_model="$expected_model_root/payload"
          expected_runtime="/srv/workspace-ci/research-engine/expanded-runtimes/qwen35-vllm-cu129-image-native-sampler-v3/f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74"

          [[ "$(id -un)" == "ci-research-engine" ]]
          [[ "${P5_MODEL_ID:-}" == "qwen3.5-4b" ]]
          [[ "${P5_MODEL_REPOSITORY:-}" == "Qwen/Qwen3.5-4B" ]]
          [[ "${P5_MODEL_REVISION:-}" == "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a" ]]
          [[ "${P5_MODEL_OBJECT_ID:-}" == "6e28e2560c07e7dabab92c55dbfb6941d5a7a75c8068bdc7a98115d8dc62072c" ]]
          [[ "${P5_MODEL_OBJECT_ROOT:-}" == "$expected_model_root" ]]
          [[ "${P5_MODEL_PATH:-}" == "$expected_model" ]]
          [[ -d "$P5_MODEL_OBJECT_ROOT" ]]
          [[ -d "$P5_MODEL_PATH" ]]
          [[ -f "$P5_MODEL_OBJECT_ROOT/receipt.json" ]]

          [[ "${P5_EXPANDED_RUNTIME:-}" == "$expected_runtime" ]]
          [[ "${P5_EXPANDED_RUNTIME_PYTHON:-}" == "$expected_runtime/bin/python" ]]
          [[ "${P5_EXPANDED_RUNTIME_TREE_SHA256:-}" == "b0cbb4efbe8673bdb421bad8036d29864bffe0687a9a654bbd95f54544659e63" ]]
          [[ "${P5_EXPANDED_RUNTIME_MANIFEST_SHA256:-}" == "f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74" ]]
          [[ "${CUDA_VISIBLE_DEVICES:-}" == "GPU-a333e68b-d1dc-6d25-1678-97b527bf55ea" ]]
          [[ "${P5_GPU_TARGET_UUID:-}" == "GPU-a333e68b-d1dc-6d25-1678-97b527bf55ea" ]]

          [[ "${HF_HUB_OFFLINE:-}" == "1" ]]
          [[ "${TRANSFORMERS_OFFLINE:-}" == "1" ]]
          [[ "${VLLM_USE_FLASHINFER_SAMPLER:-}" == "0" ]]

          if [[ -r /var/lib/workspace-ci/controller/github-token ]]; then
            echo "Controller credential unexpectedly readable" >&2
            exit 22
          fi

          echo "runner_name=$RUNNER_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Run one synthetic image-text Qwen3.5 pilot
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          RUNNER_NAME_VALUE: ${{ steps.preflight.outputs.runner_name }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          VLLM_NO_USAGE_STATS: "1"
          VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"
          TOKENIZERS_PARALLELISM: "false"
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "Checkout credentials remained in candidate git config" >&2
            exit 40
          fi

          pilot_script="$RUNNER_TEMP/qwen35_offline_pilot.py"
          cat > "$pilot_script" <<'PY'
          from __future__ import annotations
          
          import json
          import os
          import pathlib
          import resource
          import subprocess
          import threading
          import time
          import traceback
          
          from PIL import Image
          from vllm import LLM, SamplingParams
          import vllm
          
          
          def main() -> None:
              receipt_path = (
                  pathlib.Path(os.environ["RUNNER_TEMP"])
                  / "lambda-ci-qwen35-offline-pilot-receipt.json"
              )
              
              model_object_root = pathlib.Path(os.environ["P5_MODEL_OBJECT_ROOT"])
              model_path = pathlib.Path(os.environ["P5_MODEL_PATH"])
              expected_model_id = "6e28e2560c07e7dabab92c55dbfb6941d5a7a75c8068bdc7a98115d8dc62072c"
              expected_revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
              expected_runtime = "qwen35-vllm-cu129-image-native-sampler-v3"
              expected_gpu = "GPU-a333e68b-d1dc-6d25-1678-97b527bf55ea"
              
              record = {
                  "schema_version": 1,
                  "phase": "qwen35-offline-pilot",
                  "decision": "FAIL",
                  "failure_stage": "preflight",
                  "candidate_sha": os.environ["EXPECTED_SHA"],
                  "pr_number": int(os.environ["PR_NUMBER"]),
                  "actor": os.environ["ACTOR"],
                  "runner_name": os.environ["RUNNER_NAME_VALUE"],
                  "workload_class": "model-eval-single-gpu",
                  "model_id": os.environ["P5_MODEL_ID"],
                  "model_repository": os.environ["P5_MODEL_REPOSITORY"],
                  "model_revision": os.environ["P5_MODEL_REVISION"],
                  "model_object_id": os.environ["P5_MODEL_OBJECT_ID"],
                  "model_object_root": str(model_object_root),
                  "model_path": str(model_path),
                  "runtime_id": expected_runtime,
                  "runtime_tree_sha256": os.environ[
                      "P5_EXPANDED_RUNTIME_TREE_SHA256"
                  ],
                  "runtime_manifest_sha256": os.environ[
                      "P5_EXPANDED_RUNTIME_MANIFEST_SHA256"
                  ],
                  "gpu_uuid": os.environ["P5_GPU_TARGET_UUID"],
                  "cuda_visible_devices": os.environ["CUDA_VISIBLE_DEVICES"],
                  "synthetic_input": True,
                  "scientific_input_used": False,
                  "scientific_state_materialized": False,
                  "production_routing_changed": False,
                  "model_server_persistent_after_job": False,
                  "public_model_acquisition": False,
                  "model_weights_loaded": False,
                  "model_inference_performed": False,
              }
              
              def write_receipt() -> None:
                  receipt_path.write_text(
                      json.dumps(record, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
                  print(json.dumps(record, indent=2, sort_keys=True))
              
              stop_sampler = threading.Event()
              peak_gpu_mib = 0
              
              def sample_gpu() -> None:
                  nonlocal_peak = {"value": 0}
                  while not stop_sampler.is_set():
                      try:
                          raw = subprocess.check_output(
                              [
                                  "nvidia-smi",
                                  "--query-gpu=uuid,memory.used",
                                  "--format=csv,noheader,nounits",
                              ],
                              text=True,
                              stderr=subprocess.DEVNULL,
                              timeout=3,
                          )
                          for line in raw.splitlines():
                              parts = [p.strip() for p in line.split(",")]
                              if len(parts) == 2 and parts[0] == expected_gpu:
                                  nonlocal_peak["value"] = max(
                                      nonlocal_peak["value"],
                                      int(parts[1]),
                                  )
                      except Exception:
                          pass
                      stop_sampler.wait(0.25)
                  record["peak_gpu_memory_mib"] = nonlocal_peak["value"]
              
              sampler = threading.Thread(target=sample_gpu, daemon=True)
              sampler.start()
              
              try:
                  assert model_object_root.is_dir()
                  assert model_object_root.name == expected_model_id
                  assert model_path.is_dir()
                  assert model_path == model_object_root / "payload"
                  assert os.environ["P5_MODEL_REVISION"] == expected_revision
                  assert os.environ["P5_GPU_TARGET_UUID"] == expected_gpu
                  assert os.environ["HF_HUB_OFFLINE"] == "1"
                  assert os.environ["TRANSFORMERS_OFFLINE"] == "1"
              
                  record["failure_stage"] = "model-init"
                  init_started = time.perf_counter()
              
                  llm = LLM(
                      model=str(model_path),
                      tensor_parallel_size=1,
                      dtype="bfloat16",
                      max_model_len=4096,
                      max_num_seqs=1,
                      gpu_memory_utilization=0.65,
                      limit_mm_per_prompt={"image": 1},
                      trust_remote_code=False,
                      disable_log_stats=True,
                      mm_processor_cache_gb=0.25,
                  )
              
                  init_seconds = time.perf_counter() - init_started
                  record["model_init_seconds"] = init_seconds
                  record["model_weights_loaded"] = True
              
                  if init_seconds > 120:
                      raise RuntimeError(
                          f"model init exceeded 120s ceiling: {init_seconds:.3f}s"
                      )
              
                  record["failure_stage"] = "synthetic-image-text-inference"
                  image = Image.new("RGB", (64, 64), (0, 128, 255))
                  messages = [
                      {
                          "role": "user",
                          "content": [
                              {
                                  "type": "image_pil",
                                  "image_pil": image,
                              },
                              {
                                  "type": "text",
                                  "text": (
                                      "This is a deterministic synthetic CI image. "
                                      "In one short sentence, describe its dominant color."
                                  ),
                              },
                          ],
                      }
                  ]
                  sampling = SamplingParams(
                      temperature=0.0,
                      top_p=1.0,
                      seed=0,
                      max_tokens=32,
                  )
              
                  inference_started = time.perf_counter()
                  outputs = llm.chat(
                      messages,
                      sampling_params=sampling,
                      use_tqdm=False,
                      chat_template_kwargs={"enable_thinking": False},
                  )
                  inference_seconds = time.perf_counter() - inference_started
              
                  generated = outputs[0].outputs[0]
                  generated_text = generated.text.strip()
                  if not generated_text:
                      raise RuntimeError("synthetic multimodal inference returned empty text")
                  if inference_seconds > 60:
                      raise RuntimeError(
                          "synthetic inference exceeded 60s ceiling: "
                          f"{inference_seconds:.3f}s"
                      )
              
                  record.update(
                      {
                          "decision": "PASS",
                          "failure_stage": None,
                          "model_inference_performed": True,
                          "inference_calls": 1,
                          "input_modalities": ["image", "text"],
                          "generated_text": generated_text,
                          "output_tokens": len(generated.token_ids),
                          "inference_seconds": inference_seconds,
                          "vllm_version": getattr(vllm, "__version__", "unknown"),
                          "peak_process_rss_mib": (
                              resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
                              / 1024.0
                          ),
                      }
                  )
              except BaseException as exc:
                  record["failure_reason"] = f"{type(exc).__name__}: {exc}"
                  record["traceback"] = traceback.format_exc(limit=12)
                  raise
              finally:
                  stop_sampler.set()
                  sampler.join(timeout=3)
                  write_receipt()
          
          
          if __name__ == "__main__":
              main()
          PY
          chmod 0400 "$pilot_script"
          "$P5_EXPANDED_RUNTIME_PYTHON" "$pilot_script"

      - name: Upload Qwen3.5 pilot receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-ci-qwen35-offline-pilot-receipt
          path: ${{ runner.temp }}/lambda-ci-qwen35-offline-pilot-receipt.json
          if-no-files-found: error
          retention-days: 7
