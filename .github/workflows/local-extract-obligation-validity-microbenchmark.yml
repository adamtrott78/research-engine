name: Local EXTRACT Obligation Validity Precision Microbenchmark

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  obligation-validity-precision-microbenchmark:
    name: "${{ format('wc-admission-v1|workload=model-eval-obligation-validity|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/local-extract-obligation-validity-microbenchmark ')
    runs-on: lambda-research-engine-gpu
    timeout-minutes: 45

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || exit 20
          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"
          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' \
              <<<"$pr_json"
          )"
          [[ "$actual_sha" == "$expected_sha" ]]
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Prove exact Qwen runtime and two-GPU public binding
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_model_root="/srv/workspace-ci/research-engine/trusted-cache/objects/model/sha256/6e28e2560c07e7dabab92c55dbfb6941d5a7a75c8068bdc7a98115d8dc62072c"
          expected_model="$expected_model_root/payload"
          expected_runtime="/srv/workspace-ci/research-engine/expanded-runtimes/qwen35-vllm-cu129-image-native-sampler-v3/f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74"
          [[ "$(id -un)" == "ci-research-engine" ]]
          [[ "${P5_MODEL_ID:-}" == "qwen3.5-4b" ]]
          [[ "${P5_MODEL_REPOSITORY:-}" == "Qwen/Qwen3.5-4B" ]]
          [[ "${P5_MODEL_REVISION:-}" == "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a" ]]
          [[ "${P5_MODEL_OBJECT_ROOT:-}" == "$expected_model_root" ]]
          [[ "${P5_MODEL_PATH:-}" == "$expected_model" ]]
          [[ -d "$P5_MODEL_PATH" ]]
          [[ "${P5_EXPANDED_RUNTIME:-}" == "$expected_runtime" ]]
          [[ "${P5_EXPANDED_RUNTIME_PYTHON:-}" == "$expected_runtime/bin/python" ]]
          [[ "${P5_GPU_TARGET_UUIDS:-}" == "GPU-a333e68b-d1dc-6d25-1678-97b527bf55ea,GPU-cfed3394-a935-63aa-9325-c4cae7b568b6" ]]
          [[ "${CUDA_VISIBLE_DEVICES:-}" == "${P5_GPU_TARGET_UUIDS}" ]]
          [[ ! -r /var/lib/workspace-ci/controller/github-token ]]
          [[ ! -r /home/atrott ]]

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify frozen repository inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git hash-object benchmarks/document_intelligence/local-extract-obligation-validity-microbenchmark.v1.json)" == \
            "4f4238030b7b667e080c2f662646e5856deacb4f" ]]
          [[ "$(git hash-object benchmarks/document_intelligence/local-extract-wave1-corpus.v1.json)" == \
            "c472329d560df3d7dccab2bf49bf94d6805faef2" ]]

      - name: Recover exact neighborhood-rescue baseline
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_zip="$RUNNER_TEMP/neighborhood-rescue.zip"
          artifact_dir="$RUNNER_TEMP/neighborhood-rescue"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/12580076512/zip" \
            -o "$artifact_zip"
          [[ "$(sha256sum "$artifact_zip" | awk '{print $1}')" == \
            "696fa26d942767844ddb24119ae98a503febac02da4e8f3dcbf2eeb021304b89" ]]
          mkdir -m 0700 "$artifact_dir"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          report="$artifact_dir/local-extract-neighborhood-rescue.json"
          [[ "$(sha256sum "$report" | awk '{print $1}')" == \
            "e1a2f61f16cae4e957b10a9c24b475d5cb481afa9381084de65a1cd9c6568d23" ]]
          echo "BASELINE_RESCUE_REPORT=$report" >> "$GITHUB_ENV"

      - name: Install exact PDF reader ephemerally
        shell: bash
        run: |
          set -Eeuo pipefail
          pydeps="$RUNNER_TEMP/obligation-validity-pydeps"
          wheel="$RUNNER_TEMP/pypdf-6.21.1-py3-none-any.whl"
          mkdir -m 0700 "$pydeps"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://files.pythonhosted.org/packages/85/e6/24c944e473c34e818cf1b98085796fcd780465ecfe17663f2bf8fee1958b/pypdf-6.21.1-py3-none-any.whl" \
            -o "$wheel"
          [[ "$(sha256sum "$wheel" | awk '{print $1}')" == \
            "553e2d42f5bb3bb2a785a7d3de8ef90bb7df74b5413eff5a7b4388007ea9254b" ]]
          "$P5_EXPANDED_RUNTIME_PYTHON" -m zipfile -e "$wheel" "$pydeps"
          PYTHONPATH="$pydeps" "$P5_EXPANDED_RUNTIME_PYTHON" - <<'PY'
          import pypdf, torch
          assert pypdf.__version__ == "6.21.1"
          assert torch.__version__ == "2.13.0+cu129"
          assert torch.cuda.is_available()
          assert torch.cuda.device_count() == 2
          print("OBLIGATION_VALIDITY_RUNTIME_PREFLIGHT=PASS")
          PY

      - name: Run frozen obligation-validity precision microbenchmark
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          VLLM_NO_USAGE_STATS: "1"
          VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"
          TOKENIZERS_PARALLELISM: "false"
          VLLM_USE_FLASHINFER_SAMPLER: "0"
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          pydeps="$RUNNER_TEMP/obligation-validity-pydeps"
          output="$RUNNER_TEMP/local-extract-obligation-validity-microbenchmark.json"
          workdir="$RUNNER_TEMP/local-extract-obligation-validity-work"

          PYTHONPATH="$PWD/src:$pydeps" \
            "$P5_EXPANDED_RUNTIME_PYTHON" \
            benchmarks/document_intelligence/run_local_extract_obligation_validity_microbenchmark.py \
            --fixture benchmarks/document_intelligence/local-extract-wave1-corpus.v1.json \
            --design benchmarks/document_intelligence/local-extract-obligation-validity-microbenchmark.v1.json \
            --baseline-rescue-report "$BASELINE_RESCUE_REPORT" \
            --output "$output" \
            --workdir "$workdir"

          "$P5_EXPANDED_RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["design_id"] == (
              "local-extract-obligation-validity-microbenchmark-v1"
          )
          assert report["experiment_id"] == (
              "OBLIGATION_VALIDITY_PRECISION_MICROBENCH_V1"
          )
          assert report["teacher_item_id"] == "arxiv:2403.04036"
          assert report["teacher_pdf_sha256"] == (
              "1097bdfabf6cd1b1e26ff9df58b6bb810e4bf74fbd3890ad20e86316d2ee0c91"
          )
          assert report["runtime_metrics"]["model_calls"] == 14
          assert report["external_model_downloads"] == 0
          assert report["preservation_controls"][
              "evidence_set_identity_unchanged"
          ] is True
          assert report["preservation_controls"][
              "prior_supported_retention"
          ] == "9/9"
          assert report["preservation_controls"][
              "frozen_control_retention"
          ] == "7/7"
          assert report["preservation_controls"][
              "page_p2_s16_present"
          ] is True
          assert all(report["experiment_integrity"].values())
          assert report["mechanism_outcome"] in {
              "BOTH_VALIDITY_MECHANISMS_CONFIRMED",
              "SLOT_GROUNDING_ONLY_CONFIRMED",
              "HOLISTIC_VERIFIER_ONLY_CONFIRMED",
              "VALIDITY_PREMISE_REJECTED",
          }
          assert report["scientific_state_materialized"] is False
          assert report["production_routing_changed"] is False
          assert report["qwen_verify_changed"] is False
          assert report["wave7b_started"] is False
          assert report["semantic_control_or_ontology_output"] is False
          assert report["sealed_acceptance_benchmark_accessed"] is False
          assert report["acceptance_candidate_frozen"] is False
          print("OBLIGATION_VALIDITY_PRECISION_MICROBENCHMARK_RECEIPT=PASS")
          PY

      - name: Upload obligation-validity microbenchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-extract-obligation-validity-precision-microbenchmark
          path: ${{ runner.temp }}/local-extract-obligation-validity-microbenchmark.json
          if-no-files-found: error
          retention-days: 14
