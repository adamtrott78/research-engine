name: Local EXTRACT Post-Wave-6 Diagnostics

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  post-wave6-diagnostics:
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/local-extract-post-wave6-diagnostics ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid diagnostic SHA" >&2
            exit 20
          }
          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"
          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' \
              <<<"$pr_json"
          )"
          [[ "$actual_sha" == "$expected_sha" ]]
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Install exact PDF reader ephemerally
        shell: bash
        run: |
          set -Eeuo pipefail
          wheel="$RUNNER_TEMP/pypdf-6.21.1-py3-none-any.whl"
          pydeps="$RUNNER_TEMP/post-wave6-pydeps"
          url="https://files.pythonhosted.org/packages/85/e6/24c944e473c34e818cf1b98085796fcd780465ecfe17663f2bf8fee1958b/pypdf-6.21.1-py3-none-any.whl"
          expected="553e2d42f5bb3bb2a785a7d3de8ef90bb7df74b5413eff5a7b4388007ea9254b"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$wheel"
          actual="$(sha256sum "$wheel" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          mkdir -m 0700 "$pydeps"
          python3 -m zipfile -e "$wheel" "$pydeps"
          PYTHONPATH="$pydeps" python3 - <<'PY'
          import pypdf
          assert pypdf.__version__ == "6.21.1"
          print("PYPDF_EPHEMERAL_IDENTITY=PASS")
          PY

      - name: Run zero-generation post-Wave-6 diagnostics
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          pydeps="$RUNNER_TEMP/post-wave6-pydeps"
          output="$RUNNER_TEMP/local-extract-post-wave6-diagnostics.json"
          workdir="$RUNNER_TEMP/local-extract-post-wave6-work"

          PYTHONPATH="$PWD/src:$pydeps" python3 \
            benchmarks/document_intelligence/run_local_extract_post_wave6_diagnostics.py \
            --fixture benchmarks/document_intelligence/local-extract-wave1-corpus.v1.json \
            --contract benchmarks/document_intelligence/local-extract-post-wave6-diagnostics.v1.json \
            --output "$output" \
            --workdir "$workdir"

          python3 - "$output" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["scientific_state_materialized"] is False
          assert report["production_routing_changed"] is False
          assert report["qwen_model_calls"] == 0
          assert report["external_model_downloads"] == 0
          assert report["metrics"]["paper_count"] == 9
          assert report["metrics"]["historical_evidence_object_count"] == 71
          assert report["metrics"]["historical_evidence_bearing_page_count"] == 43
          assert abs(
              report["metrics"]["current_top12_historical_page_recall"]
              - 0.7441860465116279
          ) < 1e-12
          claims = report["teacher_diagnostics"]["legacy_claim_summary"]["mean_f1"]
          assert abs(
              claims["current_top12_best_single_proposition"]
              - 0.31908516604168774
          ) < 1e-12
          assert abs(
              claims["current_wave6_selected_single_proposition"]
              - 0.30305743036333815
          ) < 1e-12
          print("POST_WAVE6_DIAGNOSTIC_RECEIPT=PASS")
          PY

      - name: Upload post-Wave-6 diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-extract-post-wave6-diagnostics
          path: ${{ runner.temp }}/local-extract-post-wave6-diagnostics.json
          if-no-files-found: error
          retention-days: 14
