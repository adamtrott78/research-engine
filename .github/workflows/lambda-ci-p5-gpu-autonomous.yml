name: Lambda CI P5 Autonomous GPU Acceptance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  autonomous-gpu:
    name: "${{ format('wc-admission-v1|workload=gpu-small|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-ci-p5-gpu ')
    runs-on: lambda-research-engine-gpu
    timeout-minutes: 15

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid /lambda-ci-p5-gpu SHA" >&2
            exit 20
          }

          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"

          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' \
              <<<"$pr_json"
          )"

          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Requested SHA does not match current PR head" >&2
            echo "requested=$expected_sha" >&2
            echo "actual=$actual_sha" >&2
            exit 21
          }

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Prove fresh bounded P5 GPU runner
        id: preflight
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(id -un)" == "ci-research-engine" ]]
          [[ -n "${RUNNER_NAME:-}" ]]
          [[ -n "${RUNNER_TEMP:-}" ]]
          [[ -n "${XDG_CACHE_HOME:-}" ]]
          [[ -n "${P5_GPU_TARGET_UUID:-}" ]]
          [[ -n "${P5_GPU_SELECTED_DEVICE:-}" ]]
          [[ -n "${P5_GPU_DENIED_DEVICES:-}" ]]
          [[ "${CUDA_VISIBLE_DEVICES:-}" == "$P5_GPU_TARGET_UUID" ]]
          [[ "$P5_GPU_TARGET_UUID" == "GPU-a333e68b-d1dc-6d25-1678-97b527bf55ea" ]]

          runner_dir="$(dirname "$(dirname "$RUNNER_TEMP")")"
          job_dir="$(dirname "$runner_dir")"
          job_root="/srv/workspace-ci/research-engine/jobs"
          staging_root="/srv/workspace-ci/research-engine/staging-cache"
          staging_dir="$XDG_CACHE_HOME"

          [[ "$job_dir" == "$job_root"/p5-* ]]
          [[ "$staging_dir" == "$staging_root"/p5-* ]]
          [[ -d "$job_dir" ]]
          [[ -d "$staging_dir" ]]

          mapfile -t job_dirs < <(
            find "$job_root" -mindepth 1 -maxdepth 1 -type d -name 'p5-*' -printf '%f\n' | sort
          )
          mapfile -t staging_dirs < <(
            find "$staging_root" -mindepth 1 -maxdepth 1 -type d -name 'p5-*' -printf '%f\n' | sort
          )

          [[ "${#job_dirs[@]}" -eq 1 ]]
          [[ "${#staging_dirs[@]}" -eq 1 ]]
          [[ "${job_dirs[0]}" == "$(basename "$job_dir")" ]]
          [[ "${staging_dirs[0]}" == "$(basename "$staging_dir")" ]]

          if find "$job_root" "$staging_root" -name '.p5-autonomous-gpu-marker-*' -print -quit | grep -q .; then
            echo "Stale P5 GPU marker survived a prior runner cleanup" >&2
            exit 30
          fi

          [[ ! -r /home/atrott ]]
          [[ ! -r /home/atrott/.ssh ]]
          [[ ! -r /home/atrott/adamArchives/Adam/workspace-control ]]
          [[ ! -r /home/atrott/adamArchives/Adam/PADataset ]]
          [[ ! -r /var/lib/workspace-ci/controller/github-token ]]

          if [[ -e /var/run/docker.sock ]]; then
            [[ ! -r /var/run/docker.sock ]]
            [[ ! -w /var/run/docker.sock ]]
          fi

          if timeout 2 bash -c '</dev/tcp/127.0.0.1/5432' 2>/dev/null; then
            echo "Production PostgreSQL reachable from P5 GPU job" >&2
            exit 31
          fi

          marker=".p5-autonomous-gpu-marker-${GITHUB_RUN_ID}"
          printf '%s\n' "$EXPECTED_SHA" > "$job_dir/$marker"
          printf '%s\n' "$EXPECTED_SHA" > "$staging_dir/$marker"

          {
            echo "runner_name=$RUNNER_NAME"
            echo "job_dir_id=$(basename "$job_dir")"
            echo "staging_dir_id=$(basename "$staging_dir")"
          } >> "$GITHUB_OUTPUT"

      - name: Adversarial immutable runtime boundary
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_runtime="/srv/workspace-ci/research-engine/expanded-runtimes/qwen35-vllm-cu129-image-native-sampler-v3/f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74"
          expected_tree="b0cbb4efbe8673bdb421bad8036d29864bffe0687a9a654bbd95f54544659e63"
          expected_manifest="f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74"

          [[ "${P5_EXPANDED_RUNTIME:-}" == "$expected_runtime" ]]
          [[ "${P5_EXPANDED_RUNTIME_PYTHON:-}" == "$expected_runtime/bin/python" ]]
          [[ "${P5_EXPANDED_RUNTIME_TREE_SHA256:-}" == "$expected_tree" ]]
          [[ "${P5_EXPANDED_RUNTIME_MANIFEST_SHA256:-}" == "$expected_manifest" ]]
          [[ -x "$P5_EXPANDED_RUNTIME_PYTHON" ]]

          staging_dir="$(dirname "$XDG_CACHE_HOME")"
          [[ "$HOME" == "$staging_dir/home" ]]
          [[ "$HF_HOME" == "$staging_dir/huggingface" ]]
          [[ "$TORCH_HOME" == "$staging_dir/torch" ]]
          [[ "$TRITON_CACHE_DIR" == "$staging_dir/triton" ]]
          [[ "$TORCHINDUCTOR_CACHE_DIR" == "$staging_dir/inductor" ]]
          [[ "$CUDA_CACHE_PATH" == "$staging_dir/cuda" ]]
          [[ "$VLLM_CONFIG_ROOT" == "$staging_dir/vllm-config" ]]
          [[ "$VLLM_CACHE_ROOT" == "$staging_dir/vllm-cache" ]]
          [[ "$PYTHONPYCACHEPREFIX" == "$staging_dir/pycache" ]]
          [[ "${PYTHONDONTWRITEBYTECODE:-}" == "1" ]]
          [[ "${VLLM_USE_FLASHINFER_SAMPLER:-}" == "0" ]]

          mount_options="$(findmnt -T "$P5_EXPANDED_RUNTIME" -n -o OPTIONS)"
          case ",$mount_options," in
            *,ro,*) ;;
            *)
              echo "Expanded runtime mount is not read-only: $mount_options" >&2
              exit 32
              ;;
          esac

          "$P5_EXPANDED_RUNTIME_PYTHON" - <<'PY'
          import errno
          import importlib.metadata
          import json
          import os
          import pathlib
          import stat

          runtime = pathlib.Path(os.environ["P5_EXPANDED_RUNTIME"])
          python = pathlib.Path(os.environ["P5_EXPANDED_RUNTIME_PYTHON"])
          receipt_path = (
              pathlib.Path(os.environ["RUNNER_TEMP"])
              / "lambda-ci-p5-runtime-adversarial-receipt.json"
          )

          expected = {
              "runtime":
                  "/srv/workspace-ci/research-engine/expanded-runtimes/"
                  "qwen35-vllm-cu129-image-native-sampler-v3/"
                  "f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74",
              "tree":
                  "b0cbb4efbe8673bdb421bad8036d29864bffe0687a9a654bbd95f54544659e63",
              "manifest":
                  "f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74",
          }

          record = {
              "schema_version": 1,
              "phase": "P5-expanded-runtime-adversarial",
              "decision": "FAIL",
              "runtime_path": str(runtime),
              "runtime_python": str(python),
              "tree_digest_sha256":
                  os.environ["P5_EXPANDED_RUNTIME_TREE_SHA256"],
              "manifest_identity_sha256":
                  os.environ["P5_EXPANDED_RUNTIME_MANIFEST_SHA256"],
              "model_weights_loaded": False,
              "model_inference_performed": False,
          }

          def write_receipt():
              receipt_path.write_text(
                  json.dumps(record, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(record, indent=2, sort_keys=True))

          try:
              assert str(runtime) == expected["runtime"]
              assert str(python) == expected["runtime"] + "/bin/python"
              assert os.environ["P5_EXPANDED_RUNTIME_TREE_SHA256"] == expected["tree"]
              assert (
                  os.environ["P5_EXPANDED_RUNTIME_MANIFEST_SHA256"]
                  == expected["manifest"]
              )

              import torch
              import torchvision
              import torchcodec
              import vllm

              from vllm.model_executor.models.qwen3_5 import (
                  Qwen3_5ForConditionalGeneration,
              )

              assert importlib.metadata.version("vllm") == "0.30.0+cu129"
              assert torch.__version__ == "2.13.0+cu129"
              assert torch.version.cuda == "12.9"
              assert importlib.metadata.version("torchvision") == "0.28.0+cu129"
              assert importlib.metadata.version("torchcodec") == "0.16.0+cu129"
              assert (
                  Qwen3_5ForConditionalGeneration.__name__
                  == "Qwen3_5ForConditionalGeneration"
              )

              target = pathlib.Path(vllm.__file__)
              assert runtime in target.parents
              target_stat = target.stat()

              allowed_denials = {
                  errno.EACCES,
                  errno.EPERM,
                  errno.EROFS,
              }
              mutation_results = {}

              def expect_denied(name, operation):
                  try:
                      operation()
                  except OSError as exc:
                      mutation_results[name] = {
                          "denied": True,
                          "errno": exc.errno,
                      }
                      if exc.errno not in allowed_denials:
                          raise
                  else:
                      mutation_results[name] = {
                          "denied": False,
                          "errno": None,
                      }
                      raise RuntimeError(
                          f"runtime mutation unexpectedly permitted: {name}"
                      )

              expect_denied(
                  "append_open",
                  lambda: os.close(
                      os.open(target, os.O_WRONLY | os.O_APPEND)
                  ),
              )
              expect_denied(
                  "chmod_same_mode",
                  lambda: os.chmod(
                      target,
                      stat.S_IMODE(target_stat.st_mode),
                  ),
              )
              expect_denied(
                  "truncate_same_size",
                  lambda: os.truncate(target, target_stat.st_size),
              )

              create_probe = target.parent / ".p5-runtime-create-probe"
              expect_denied(
                  "create_sibling",
                  lambda: os.close(
                      os.open(
                          create_probe,
                          os.O_WRONLY | os.O_CREAT | os.O_EXCL,
                          0o600,
                      )
                  ),
              )

              rename_probe = target.with_name(
                  target.name + ".p5-runtime-rename-probe"
              )
              try:
                  os.rename(target, rename_probe)
              except OSError as exc:
                  mutation_results["rename"] = {
                      "denied": True,
                      "errno": exc.errno,
                  }
                  if exc.errno not in allowed_denials:
                      raise
              else:
                  mutation_results["rename"] = {
                      "denied": False,
                      "errno": None,
                  }
                  try:
                      os.rename(rename_probe, target)
                  finally:
                      raise RuntimeError(
                          "runtime rename unexpectedly permitted"
                      )

              writable_roots = {
                  "HOME": pathlib.Path(os.environ["HOME"]),
                  "XDG_CACHE_HOME":
                      pathlib.Path(os.environ["XDG_CACHE_HOME"]),
                  "HF_HOME": pathlib.Path(os.environ["HF_HOME"]),
                  "TORCH_HOME": pathlib.Path(os.environ["TORCH_HOME"]),
                  "VLLM_CACHE_ROOT":
                      pathlib.Path(os.environ["VLLM_CACHE_ROOT"]),
              }

              writable_results = {}
              for name, root in writable_roots.items():
                  root.mkdir(parents=True, exist_ok=True)
                  probe = root / ".p5-write-probe"
                  probe.write_text("ok\n", encoding="utf-8")
                  probe.unlink()
                  writable_results[name] = True

              record.update(
                  {
                      "decision": "PASS",
                      "vllm": importlib.metadata.version("vllm"),
                      "torch": torch.__version__,
                      "torch_cuda_runtime": torch.version.cuda,
                      "torchvision":
                          importlib.metadata.version("torchvision"),
                      "torchcodec":
                          importlib.metadata.version("torchcodec"),
                      "qwen35_multimodal_class_import":
                          Qwen3_5ForConditionalGeneration.__name__,
                      "mutation_results": mutation_results,
                      "job_local_write_results": writable_results,
                      "candidate_runtime_mutation_denied": True,
                      "shared_project_home_used": False,
                  }
              )
              write_receipt()
          except BaseException as exc:
              record["failure_reason"] = f"{type(exc).__name__}: {exc}"
              write_receipt()
              raise
          PY

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Execute bounded autonomous GPU validation
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          RUNNER_NAME_VALUE: ${{ steps.preflight.outputs.runner_name }}
          JOB_DIR_ID: ${{ steps.preflight.outputs.job_dir_id }}
          STAGING_DIR_ID: ${{ steps.preflight.outputs.staging_dir_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "Checkout credentials remained in candidate git config" >&2
            exit 40
          fi

          python3 - <<'PY'
          import ctypes
          import ctypes.util
          import json
          import os
          import pathlib
          import subprocess
          import traceback

          receipt_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lambda-ci-p5-gpu-autonomous-receipt.json"
          expected_uuid = os.environ["P5_GPU_TARGET_UUID"]
          selected_device = os.environ["P5_GPU_SELECTED_DEVICE"]
          denied_devices = [
              item for item in os.environ["P5_GPU_DENIED_DEVICES"].split(",") if item
          ]
          support_devices = [
              item for item in os.environ.get("P5_GPU_SUPPORT_DEVICES", "").split(",") if item
          ]

          receipt = {
              "schema_version": 1,
              "phase": "P5-autonomous-gpu-small",
              "decision": "FAIL",
              "failure_stage": "device-boundary",
              "expected_sha": os.environ["EXPECTED_SHA"],
              "actual_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "pr_number": int(os.environ["PR_NUMBER"]),
              "actor": os.environ["ACTOR"],
              "runner_name": os.environ["RUNNER_NAME_VALUE"],
              "runner_user": os.environ.get("USER"),
              "uid": os.getuid(),
              "gid": os.getgid(),
              "job_dir_id": os.environ["JOB_DIR_ID"],
              "staging_dir_id": os.environ["STAGING_DIR_ID"],
              "cuda_visible_devices": os.environ.get("CUDA_VISIBLE_DEVICES"),
              "target_gpu_uuid": expected_uuid,
              "selected_gpu_device": selected_device,
              "denied_gpu_devices": denied_devices,
              "gpu_support_devices": support_devices,
              "stale_job_workspace_absent": True,
              "stale_staging_workspace_absent": True,
              "stale_marker_absent": True,
              "personal_home_readable": False,
              "workspace_control_readable": False,
              "controller_credential_readable": False,
              "docker_access": False,
              "production_postgres_reachable": False,
              "scientific_state_materialized": False,
              "model_server_started": False,
              "checkout_credentials_persisted": False,
              "scale_set_target": "lambda-research-engine-gpu",
              "profile_expected": "gpu-small",
          }

          def write_receipt():
              receipt_path.write_text(
                  json.dumps(receipt, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(receipt, indent=2, sort_keys=True))

          try:
              fd = os.open(selected_device, os.O_RDWR)
              os.close(fd)

              denied_results = {}
              for path in denied_devices:
                  try:
                      fd = os.open(path, os.O_RDWR)
                  except OSError as exc:
                      denied_results[path] = {"denied": True, "errno": exc.errno}
                  else:
                      os.close(fd)
                      denied_results[path] = {"denied": False, "errno": None}

              if not denied_results or not all(row["denied"] for row in denied_results.values()):
                  raise RuntimeError(
                      f"non-selected GPU device unexpectedly openable: {denied_results}"
                  )

              receipt["selected_gpu_device_open"] = True
              receipt["denied_gpu_device_results"] = denied_results
              receipt["failure_stage"] = "cuda-init"

              libname = ctypes.util.find_library("cuda") or "libcuda.so.1"
              cuda = ctypes.CDLL(libname)

              CUdevice = ctypes.c_int
              CUcontext = ctypes.c_void_p
              CUdeviceptr = ctypes.c_uint64

              cuda.cuInit.argtypes = [ctypes.c_uint]
              cuda.cuInit.restype = ctypes.c_int
              cuda.cuDriverGetVersion.argtypes = [ctypes.POINTER(ctypes.c_int)]
              cuda.cuDriverGetVersion.restype = ctypes.c_int
              cuda.cuDeviceGetCount.argtypes = [ctypes.POINTER(ctypes.c_int)]
              cuda.cuDeviceGetCount.restype = ctypes.c_int
              cuda.cuDeviceGet.argtypes = [ctypes.POINTER(CUdevice), ctypes.c_int]
              cuda.cuDeviceGet.restype = ctypes.c_int
              cuda.cuDeviceGetName.argtypes = [ctypes.c_char_p, ctypes.c_int, CUdevice]
              cuda.cuDeviceGetName.restype = ctypes.c_int
              cuda.cuDeviceGetUuid_v2.argtypes = [ctypes.c_void_p, CUdevice]
              cuda.cuDeviceGetUuid_v2.restype = ctypes.c_int
              cuda.cuDeviceTotalMem_v2.argtypes = [ctypes.POINTER(ctypes.c_size_t), CUdevice]
              cuda.cuDeviceTotalMem_v2.restype = ctypes.c_int
              cuda.cuCtxCreate_v2.argtypes = [ctypes.POINTER(CUcontext), ctypes.c_uint, CUdevice]
              cuda.cuCtxCreate_v2.restype = ctypes.c_int
              cuda.cuCtxDestroy_v2.argtypes = [CUcontext]
              cuda.cuCtxDestroy_v2.restype = ctypes.c_int
              cuda.cuMemAlloc_v2.argtypes = [ctypes.POINTER(CUdeviceptr), ctypes.c_size_t]
              cuda.cuMemAlloc_v2.restype = ctypes.c_int
              cuda.cuMemFree_v2.argtypes = [CUdeviceptr]
              cuda.cuMemFree_v2.restype = ctypes.c_int
              cuda.cuMemGetInfo_v2.argtypes = [
                  ctypes.POINTER(ctypes.c_size_t),
                  ctypes.POINTER(ctypes.c_size_t),
              ]
              cuda.cuMemGetInfo_v2.restype = ctypes.c_int

              def check(rc, name):
                  if rc != 0:
                      raise RuntimeError(f"{name} failed rc={rc}")

              check(cuda.cuInit(0), "cuInit")

              driver_api_version = ctypes.c_int()
              check(
                  cuda.cuDriverGetVersion(ctypes.byref(driver_api_version)),
                  "cuDriverGetVersion",
              )

              count = ctypes.c_int()
              check(cuda.cuDeviceGetCount(ctypes.byref(count)), "cuDeviceGetCount")
              if count.value != 1:
                  raise RuntimeError(f"expected exactly one CUDA-visible GPU, got {count.value}")

              device = CUdevice()
              check(cuda.cuDeviceGet(ctypes.byref(device), 0), "cuDeviceGet")

              uuid_buf = (ctypes.c_ubyte * 16)()
              check(cuda.cuDeviceGetUuid_v2(ctypes.byref(uuid_buf), device), "cuDeviceGetUuid_v2")
              raw = bytes(uuid_buf)
              actual_uuid = "GPU-" + (
                  f"{raw[0:4].hex()}-{raw[4:6].hex()}-{raw[6:8].hex()}-"
                  f"{raw[8:10].hex()}-{raw[10:16].hex()}"
              )
              if actual_uuid.lower() != expected_uuid.lower():
                  raise RuntimeError(f"CUDA UUID mismatch: {actual_uuid} != {expected_uuid}")

              name_buf = ctypes.create_string_buffer(256)
              check(cuda.cuDeviceGetName(name_buf, len(name_buf), device), "cuDeviceGetName")

              total_device_bytes = ctypes.c_size_t()
              check(
                  cuda.cuDeviceTotalMem_v2(ctypes.byref(total_device_bytes), device),
                  "cuDeviceTotalMem_v2",
              )

              receipt.update(
                  {
                      "failure_stage": "cuda-allocation",
                      "cuda_device_count": count.value,
                      "cuda_device_uuid": actual_uuid,
                      "cuda_device_name": name_buf.value.decode("utf-8", errors="replace"),
                      "cuda_driver_api_version": driver_api_version.value,
                      "cuda_device_total_bytes": total_device_bytes.value,
                  }
              )

              ctx = CUcontext()
              check(cuda.cuCtxCreate_v2(ctypes.byref(ctx), 0, device), "cuCtxCreate_v2")

              ptr = CUdeviceptr()
              allocation_bytes = 256 * 1024 * 1024
              free_before = ctypes.c_size_t()
              total_before = ctypes.c_size_t()
              free_during = ctypes.c_size_t()
              total_during = ctypes.c_size_t()
              free_after = ctypes.c_size_t()
              total_after = ctypes.c_size_t()

              try:
                  check(
                      cuda.cuMemGetInfo_v2(
                          ctypes.byref(free_before), ctypes.byref(total_before)
                      ),
                      "cuMemGetInfo_v2(before)",
                  )
                  check(cuda.cuMemAlloc_v2(ctypes.byref(ptr), allocation_bytes), "cuMemAlloc_v2")
                  check(
                      cuda.cuMemGetInfo_v2(
                          ctypes.byref(free_during), ctypes.byref(total_during)
                      ),
                      "cuMemGetInfo_v2(during)",
                  )
                  consumed = free_before.value - free_during.value
                  if consumed < 200 * 1024 * 1024:
                      raise RuntimeError(
                          f"GPU allocation did not consume expected VRAM: {consumed} bytes"
                      )
                  check(cuda.cuMemFree_v2(ptr), "cuMemFree_v2")
                  ptr = CUdeviceptr()
                  check(
                      cuda.cuMemGetInfo_v2(
                          ctypes.byref(free_after), ctypes.byref(total_after)
                      ),
                      "cuMemGetInfo_v2(after)",
                  )
              finally:
                  if ptr.value:
                      cuda.cuMemFree_v2(ptr)
                  cuda.cuCtxDestroy_v2(ctx)

              receipt.update(
                  {
                      "decision": "PASS",
                      "failure_stage": None,
                      "allocation_bytes": allocation_bytes,
                      "cuda_free_before_bytes": free_before.value,
                      "cuda_free_during_bytes": free_during.value,
                      "cuda_free_after_bytes": free_after.value,
                      "cuda_total_bytes": total_before.value,
                  }
              )
              write_receipt()
          except BaseException as exc:
              receipt["failure_reason"] = f"{type(exc).__name__}: {exc}"
              receipt["traceback"] = traceback.format_exc(limit=8)
              write_receipt()
              raise
          PY

