name: Lambda CI Local EXTRACT Wave 4

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  local-extract-wave4:
    name: "${{ format('wc-admission-v1|workload=model-eval-local-extract-wave4|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-ci-local-extract-wave4 ')
    runs-on: lambda-research-engine-gpu
    timeout-minutes: 45

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid /lambda-ci-local-extract-wave4 SHA" >&2
            exit 20
          }

          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"

          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' \
              <<<"$pr_json"
          )"

          [[ "$actual_sha" == "$expected_sha" ]]
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Prove exact model runtime and two-GPU binding
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_model_root="/srv/workspace-ci/research-engine/trusted-cache/objects/model/sha256/6e28e2560c07e7dabab92c55dbfb6941d5a7a75c8068bdc7a98115d8dc62072c"
          expected_model="$expected_model_root/payload"
          expected_runtime="/srv/workspace-ci/research-engine/expanded-runtimes/qwen35-vllm-cu129-image-native-sampler-v3/f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74"

          [[ "$(id -un)" == "ci-research-engine" ]]
          [[ "${P5_MODEL_ID:-}" == "qwen3.5-4b" ]]
          [[ "${P5_MODEL_REPOSITORY:-}" == "Qwen/Qwen3.5-4B" ]]
          [[ "${P5_MODEL_REVISION:-}" == "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a" ]]
          [[ "${P5_MODEL_OBJECT_ID:-}" == "6e28e2560c07e7dabab92c55dbfb6941d5a7a75c8068bdc7a98115d8dc62072c" ]]
          [[ "${P5_MODEL_OBJECT_ROOT:-}" == "$expected_model_root" ]]
          [[ "${P5_MODEL_PATH:-}" == "$expected_model" ]]
          [[ -d "$P5_MODEL_PATH" ]]
          [[ -f "$P5_MODEL_OBJECT_ROOT/receipt.json" ]]

          [[ "${P5_EXPANDED_RUNTIME:-}" == "$expected_runtime" ]]
          [[ "${P5_EXPANDED_RUNTIME_PYTHON:-}" == "$expected_runtime/bin/python" ]]
          [[ "${P5_EXPANDED_RUNTIME_TREE_SHA256:-}" == "b0cbb4efbe8673bdb421bad8036d29864bffe0687a9a654bbd95f54544659e63" ]]
          [[ "${P5_EXPANDED_RUNTIME_MANIFEST_SHA256:-}" == "f67ff9a26690c55930232c915e59e826e3cca2dd89012de9e35a852032b38f74" ]]
          [[ "${P5_GPU_TARGET_UUIDS:-}" == "GPU-a333e68b-d1dc-6d25-1678-97b527bf55ea,GPU-cfed3394-a935-63aa-9325-c4cae7b568b6" ]]
          [[ "${P5_GPU_SELECTED_DEVICES:-}" == "/dev/nvidia1,/dev/nvidia0" ]]
          [[ "${CUDA_VISIBLE_DEVICES:-}" == "${P5_GPU_TARGET_UUIDS}" ]]
          [[ "${P5_GPU_DENIED_DEVICES:-}" == "" ]]

          [[ "${HF_HUB_OFFLINE:-}" == "1" ]]
          [[ "${TRANSFORMERS_OFFLINE:-}" == "1" ]]
          [[ "${VLLM_USE_FLASHINFER_SAMPLER:-}" == "0" ]]

          if [[ -r /var/lib/workspace-ci/controller/github-token ]]; then
            echo "Controller credential unexpectedly readable" >&2
            exit 22
          fi

          echo "runner_name=$RUNNER_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Install exact pure-Python PDF reader ephemerally
        shell: bash
        run: |
          set -Eeuo pipefail

          wheel="$RUNNER_TEMP/pypdf-6.21.1-py3-none-any.whl"
          pydeps="$RUNNER_TEMP/wave4-pydeps"
          url="https://files.pythonhosted.org/packages/85/e6/24c944e473c34e818cf1b98085796fcd780465ecfe17663f2bf8fee1958b/pypdf-6.21.1-py3-none-any.whl"
          expected="553e2d42f5bb3bb2a785a7d3de8ef90bb7df74b5413eff5a7b4388007ea9254b"

          curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$wheel"
          actual="$(sha256sum "$wheel" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]

          mkdir -m 0700 "$pydeps"
          "$P5_EXPANDED_RUNTIME_PYTHON" -m zipfile -e "$wheel" "$pydeps"
          PYTHONPATH="$pydeps" "$P5_EXPANDED_RUNTIME_PYTHON" - <<'PY'
          import pypdf
          assert pypdf.__version__ == "6.21.1"
          print("PYPDF_EPHEMERAL_IDENTITY=PASS")
          PY

      - name: Run nine-paper local EXTRACT Wave 4
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          VLLM_NO_USAGE_STATS: "1"
          VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"
          TOKENIZERS_PARALLELISM: "false"
          VLLM_USE_FLASHINFER_SAMPLER: "0"
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "Checkout credentials remained in candidate git config" >&2
            exit 40
          fi

          pydeps="$RUNNER_TEMP/wave4-pydeps"
          output="$RUNNER_TEMP/local-extract-wave4-report.json"
          workdir="$RUNNER_TEMP/local-extract-wave4-work"

          PYTHONPATH="$PWD/src:$pydeps" \
            "$P5_EXPANDED_RUNTIME_PYTHON" \
            benchmarks/document_intelligence/run_local_extract_wave4.py \
            --fixture benchmarks/document_intelligence/local-extract-wave1-corpus.v1.json \
            --output "$output" \
            --workdir "$workdir"

          "$P5_EXPANDED_RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["scientific_state_materialized"] is False
          assert report["production_routing_changed"] is False
          assert report["public_model_acquisition"] is False
          assert report["model_id"] == "qwen3.5-4b"
          assert report["model_revision"] == "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
          assert report["runtime_tree_sha256"] == "b0cbb4efbe8673bdb421bad8036d29864bffe0687a9a654bbd95f54544659e63"
          assert report["tensor_parallel_size"] == 2
          assert report["retrieval_strategy"] == "FACET_INTERLEAVED_BM25_V1"
          assert report["top_k_regions"] == 12
          assert report["metrics"]["paper_count"] == 9
          assert report["metrics"]["historical_evidence_count"] == 71
          assert report["metrics"]["historical_evidence_bearing_page_count"] == 43
          assert 0 <= report["metrics"]["proposal_model_calls"] <= 108
          assert 0 <= report["metrics"]["normalization_model_calls"] <= 108
          assert report["metrics"]["model_calls"] == (
              report["metrics"]["proposal_model_calls"]
              + report["metrics"]["normalization_model_calls"]
          )
          assert report["metrics"]["model_calls"] <= 216
          assert report["metrics"]["paper_wide_collateral_loss_count"] == 0
          assert report["region_construction"]["id"] == "WAVE2_EXACT650_V1"
          assert report["metrics"]["accepted_claim_count"] <= 108
          assert "teacher_available_proposition_alignment" in report
          assert "teacher_selected_proposition_alignment" in report
          assert report["wave4_decision"] in {"PROMISING", "PARTIAL", "REJECT"}
          print("LOCAL_EXTRACT_WAVE4_RECEIPT=PASS")
          PY

      - name: Upload EXTRACT Wave 4 report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-extract-wave4-report
          path: ${{ runner.temp }}/local-extract-wave4-report.json
          if-no-files-found: error
          retention-days: 14
