name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: research_engine
          POSTGRES_USER: research_engine
          POSTGRES_PASSWORD: research_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_engine -d research_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RESEARCH_ENGINE_DATABASE_URL: postgresql://research_engine:research_engine@localhost:5432/research_engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: python -m pytest -q
