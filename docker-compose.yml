services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: research_engine
      POSTGRES_USER: research_engine
      POSTGRES_PASSWORD: research_engine
    ports:
      - "5432:5432"
    volumes:
      - research_engine_pg:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_engine -d research_engine"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  research_engine_pg:
